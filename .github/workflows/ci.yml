name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

# Cancel obsolete runs on the same PR/feature branch to save runner time.
# Main pushes are never cancelled (they don't match the PR/feat patterns).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — the workflow only reads code and runs checks.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run frontend tests
        env:
          # The Supabase client throws at import time if these are missing.
          # Tests that actually call Supabase mock the API module; these dummy
          # values only satisfy the module-level guard in src/lib/supabase/client.ts.
          VITE_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
        run: npm run test

      - name: Run frontend tests with coverage
        env:
          VITE_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit (high severity only)
        run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Clean up previous Supabase instance
        run: supabase stop --no-backup || true

      - name: Start Supabase
        run: supabase start

      - name: Verify Supabase status
        run: supabase status

      - name: Reset database
        run: supabase db reset

      - name: Verify migrations applied
        run: supabase migration list --local

      - name: Run database/RLS tests
        run: bash scripts/test-database.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno static analysis (check + lint)
        run: bash scripts/test-edge-function.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Start Supabase
        run: supabase start

      - name: Reset database with seed data
        run: supabase db reset

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
