name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

# Cancel obsolete runs on the same PR/feature branch to save runner time.
# Main pushes are never cancelled (they don't match the PR/feat patterns).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — the workflow only reads code and runs checks.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (high severity only)
        run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Clean up previous Supabase instance
        run: supabase stop --no-backup || true

      - name: Start Supabase
        run: supabase start

      - name: Verify Supabase status
        run: supabase status

      - name: Reset database
        run: supabase db reset

      - name: Verify migrations applied
        run: supabase migration list --local

      - name: Run database/RLS tests
        run: bash scripts/test-database.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
