project_id = "desafio-focon"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed-auth.sql", "./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false
port = 54325
smtp_port = 54326

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[functions]
enabled = true

[functions.invite-user]
enabled = true
verify_jwt = true
# Allowed origins for CORS and redirect validation.
# In production, set ALLOWED_WEB_ORIGINS to the deployed frontend URL(s).
env_vars = ["ALLOWED_WEB_ORIGINS"]
